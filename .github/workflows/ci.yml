name: CI

on:
  pull_request:
  workflow_call:
    inputs:
      run-security:
        type: boolean
        default: true
      run-release:
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ---------------------------------------------------------------------------
  # Quality
  # ---------------------------------------------------------------------------

  quality:
    uses: wphillipmoore/standard-actions/.github/workflows/ci-quality.yml@v1.5
    with:
      language: python
      versions: '["3.12", "3.13", "3.14"]'

  test:
    uses: wphillipmoore/standard-actions/.github/workflows/ci-test.yml@v1.5
    with:
      language: python
      versions: '["3.12", "3.13", "3.14"]'

  audit:
    uses: wphillipmoore/standard-actions/.github/workflows/ci-audit.yml@v1.5
    with:
      language: python
      versions: '["3.14"]'

  # ---------------------------------------------------------------------------
  # Integration tests
  # ---------------------------------------------------------------------------

  integration-tests:
    name: "test / integration / ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            project-suffix: "3-12"
            qm1-rest-port: "9447"
            qm2-rest-port: "9448"
            qm1-mq-port: "1416"
            qm2-mq-port: "1417"
          - python-version: "3.13"
            project-suffix: "3-13"
            qm1-rest-port: "9449"
            qm2-rest-port: "9450"
            qm1-mq-port: "1418"
            qm2-mq-port: "1419"
          - python-version: "3.14"
            project-suffix: "3-14"
            qm1-rest-port: "9451"
            qm2-rest-port: "9452"
            qm1-mq-port: "1420"
            qm2-mq-port: "1421"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: wphillipmoore/standard-actions/actions/python/setup@v1.5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Setup MQ environment
        uses: wphillipmoore/mq-rest-admin-dev-environment/.github/actions/setup-mq@main
        with:
          project-name: mqrest-python-${{ matrix.project-suffix }}
          qm1-rest-port: ${{ matrix.qm1-rest-port }}
          qm2-rest-port: ${{ matrix.qm2-rest-port }}
          qm1-mq-port: ${{ matrix.qm1-mq-port }}
          qm2-mq-port: ${{ matrix.qm2-mq-port }}

      - name: Run integration tests
        env:
          MQ_REST_BASE_URL: https://localhost:${{ matrix.qm1-rest-port }}/ibmmq/rest/v2
          MQ_REST_BASE_URL_QM2: https://localhost:${{ matrix.qm2-rest-port }}/ibmmq/rest/v2
        run: |
          MQ_SKIP_LIFECYCLE=1 \
          MQ_REST_ADMIN_RUN_INTEGRATION=1 \
          uv run pytest -m integration

  # ---------------------------------------------------------------------------
  # Security and standards
  # ---------------------------------------------------------------------------

  security:
    uses: wphillipmoore/standard-actions/.github/workflows/ci-security.yml@v1.5
    with:
      language: python
      run-standards: ${{ inputs.run-release || true }}
      run-security: ${{ inputs.run-security || true }}
    permissions:
      contents: read
      security-events: write

  # ---------------------------------------------------------------------------
  # Release
  # ---------------------------------------------------------------------------

  release:
    uses: wphillipmoore/standard-actions/.github/workflows/ci-release.yml@v1.5
    with:
      language: python
      run-release: ${{ inputs.run-release != false }}
