name: CI

on:
  pull_request:
  workflow_call:
    inputs:
      run-security:
        type: boolean
        default: true
      run-release:
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ---------------------------------------------------------------------------
  # Quality
  # ---------------------------------------------------------------------------

  quality:
    uses: wphillipmoore/standard-actions/.github/workflows/ci-quality.yml@v1.5
    with:
      language: python
      versions: '["3.12", "3.13", "3.14"]'

  lint:
    name: "quality / lint / ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    container:
      image: ghcr.io/wphillipmoore/dev-python:${{ matrix.python-version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Lint
        run: uv run ruff check

      - name: Format check
        run: uv run ruff format --check .

  typecheck:
    name: "quality / typecheck / ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    container:
      image: ghcr.io/wphillipmoore/dev-python:${{ matrix.python-version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Type check
        run: uv run mypy src/

  test:
    name: "test / unit / ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    container:
      image: ghcr.io/wphillipmoore/dev-python:${{ matrix.python-version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Tests
        run: |
          uv run pytest \
            --cov=pymqrest \
            --cov=examples \
            --cov-report=term-missing \
            --cov-branch \
            --cov-fail-under=100

  audit:
    name: "audit / dependencies / ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    container:
      image: ghcr.io/wphillipmoore/dev-python:${{ matrix.python-version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check lockfile integrity
        run: uv lock --check

  # ---------------------------------------------------------------------------
  # Integration tests
  # ---------------------------------------------------------------------------

  integration-tests:
    name: "test / integration / ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            project-suffix: "3-12"
            qm1-rest-port: "9447"
            qm2-rest-port: "9448"
            qm1-mq-port: "1416"
            qm2-mq-port: "1417"
          - python-version: "3.13"
            project-suffix: "3-13"
            qm1-rest-port: "9449"
            qm2-rest-port: "9450"
            qm1-mq-port: "1418"
            qm2-mq-port: "1419"
          - python-version: "3.14"
            project-suffix: "3-14"
            qm1-rest-port: "9451"
            qm2-rest-port: "9452"
            qm1-mq-port: "1420"
            qm2-mq-port: "1421"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: wphillipmoore/standard-actions/actions/python/setup@v1.5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Setup MQ environment
        uses: wphillipmoore/mq-rest-admin-dev-environment/.github/actions/setup-mq@main
        with:
          project-name: mqrest-python-${{ matrix.project-suffix }}
          qm1-rest-port: ${{ matrix.qm1-rest-port }}
          qm2-rest-port: ${{ matrix.qm2-rest-port }}
          qm1-mq-port: ${{ matrix.qm1-mq-port }}
          qm2-mq-port: ${{ matrix.qm2-mq-port }}

      - name: Run integration tests
        env:
          MQ_REST_BASE_URL: https://localhost:${{ matrix.qm1-rest-port }}/ibmmq/rest/v2
          MQ_REST_BASE_URL_QM2: https://localhost:${{ matrix.qm2-rest-port }}/ibmmq/rest/v2
        run: |
          MQ_SKIP_LIFECYCLE=1 \
          MQ_REST_ADMIN_RUN_INTEGRATION=1 \
          uv run pytest -m integration

  # ---------------------------------------------------------------------------
  # Security and standards
  # ---------------------------------------------------------------------------

  security:
    uses: wphillipmoore/standard-actions/.github/workflows/ci-security.yml@v1.5
    with:
      language: python
      run-standards: ${{ inputs.run-release || true }}
      run-security: ${{ inputs.run-security || true }}
    permissions:
      contents: read
      security-events: write

  # ---------------------------------------------------------------------------
  # Release
  # ---------------------------------------------------------------------------

  release:
    name: "release / version-bump"
    if: ${{ inputs.run-release != false }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/wphillipmoore/dev-python:3.14
    steps:
      - name: Skip on non-PR events
        if: github.event_name != 'pull_request'
        run: echo "Not a pull request; skipping release gates."

      - name: Checkout code
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Mark workspace safe for git
        if: github.event_name == 'pull_request'
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Version divergence gate (PRs targeting develop)
        if: github.event_name == 'pull_request' && github.base_ref == 'develop'
        uses: wphillipmoore/standard-actions/actions/release-gates/version-divergence@v1.5
        with:
          head-version-command: python3 -c "import tomllib; from pathlib import Path; print(tomllib.loads(Path('pyproject.toml').read_text())['project']['version'])"
          main-version-command: git show origin/main:pyproject.toml | python3 -c "import sys, tomllib; print(tomllib.loads(sys.stdin.read())['project']['version'])"
